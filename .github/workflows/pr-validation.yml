name: PR Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint HTML & CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML (HTMLHint)
        run: npx --yes htmlhint "**/*.html"

      - name: Lint inline CSS (Stylelint)
        run: |
          npm install --no-save stylelint stylelint-config-standard postcss-html
          npx stylelint "**/*.html" --config .stylelintrc.json
